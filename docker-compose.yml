version: '3.8'

services:
  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      - PORT=8000
    networks:
      - vision-mesh

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - vision-mesh

networks:
  vision-mesh:
    driver: bridge
